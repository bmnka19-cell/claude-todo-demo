<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0f5; --surface:#ffffff; --ink:#14212b; --muted:#6a7b89; --line:#dde5ec;
  --accent:#0f766e; --accent-soft:#d9f0ed; --danger:#b42318; --shadow:0 18px 50px -20px rgba(20,33,43,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e161d; --surface:#16212a; --ink:#e8eef3; --muted:#8fa1af; --line:#243440;
    --accent:#3cc4b6; --accent-soft:#173a3a; --danger:#ff8a80; --shadow:0 18px 50px -20px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#16212a; --ink:#e8eef3; --muted:#8fa1af; --line:#243440;
  --accent:#3cc4b6; --accent-soft:#173a3a; --danger:#ff8a80; --shadow:0 18px 50px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  display:flex; justify-content:center; align-items:flex-start;
}
.app{width:100%; max-width:600px; background:var(--surface); border-radius:22px; box-shadow:var(--shadow); overflow:hidden; margin-top:4vh}
header{display:flex; align-items:center; gap:18px; padding:30px 30px 22px}
.ring{position:relative; width:64px; height:64px; flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:6}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s ease}
.ring span{position:absolute; inset:0; display:grid; place-items:center; font-weight:700; font-size:.95rem}
.title{flex:1; min-width:0}
h1{margin:0; font-size:1.75rem; letter-spacing:-.02em; line-height:1.15}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem}
.theme{border:1px solid var(--line); background:transparent; color:var(--muted); width:38px; height:38px; border-radius:50%; cursor:pointer; display:grid; place-items:center}
.theme:hover{color:var(--ink); border-color:var(--muted)}
form{display:flex; gap:10px; padding:0 30px 22px}
input[type=text]{
  flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--bg);
  border:1.5px solid transparent; border-radius:12px; padding:14px 16px; outline:none; transition:border-color .15s, background .15s;
}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus{border-color:var(--accent); background:var(--surface)}
.add{font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:12px; padding:0 22px; cursor:pointer; transition:filter .15s, transform .1s}
:root[data-theme="dark"] .add{color:#0e161d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add{color:#0e161d}}
.add:hover{filter:brightness(1.08)} .add:active{transform:scale(.97)}
.tabs{display:flex; gap:4px; padding:0 30px; border-bottom:1px solid var(--line)}
.tab{font:inherit; font-weight:500; color:var(--muted); background:none; border:0; padding:10px 12px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent); border-color:var(--accent); font-weight:600}
ul{list-style:none; margin:0; padding:8px 18px; min-height:120px; max-height:52vh; overflow:auto}
li{display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; animation:in .22s ease}
li:hover{background:var(--bg)}
@keyframes in{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.check{appearance:none; -webkit-appearance:none; width:22px; height:22px; flex:none; border:2px solid var(--muted); border-radius:7px; cursor:pointer; display:grid; place-content:center; transition:all .15s; margin:0}
.check:checked{background:var(--accent); border-color:var(--accent)}
.check:checked::after{content:""; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px)}
.text{flex:1; min-width:0; overflow-wrap:anywhere; cursor:text; line-height:1.4}
li.done .text{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--muted)}
.edit{flex:1; font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--accent); border-radius:8px; padding:6px 10px; outline:none}
.del{border:0; background:none; color:var(--muted); cursor:pointer; padding:6px; border-radius:8px; opacity:0; display:grid; place-items:center}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--danger); background:var(--accent-soft)}
@media (hover:none){.del{opacity:1}}
.empty{text-align:center; color:var(--muted); padding:34px 20px}
.empty strong{display:block; color:var(--ink); margin-bottom:4px; font-size:1.05rem}
footer{display:flex; justify-content:space-between; align-items:center; padding:14px 30px 20px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line)}
.clear{font:inherit; font-size:.9rem; color:var(--muted); background:none; border:0; cursor:pointer; padding:4px 0}
.clear:hover{color:var(--danger)}
.clear[disabled]{opacity:.4; cursor:default; color:var(--muted)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (max-width:480px){header,form{padding-left:20px; padding-right:20px} .tabs{padding:0 20px} footer{padding:14px 20px 18px} ul{padding:8px 8px} h1{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="ring" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="bar" id="bar" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
      <span id="pct">0%</span>
    </div>
    <div class="title">
      <h1>Today's tasks</h1>
      <p class="sub" id="date"></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Add a task" aria-label="New task" maxlength="200">
    <button class="add" type="submit">Add task</button>
  </form>

  <div class="tabs" role="tablist" aria-label="Filter tasks">
    <button class="tab" role="tab" data-f="all" aria-selected="true">All</button>
    <button class="tab" role="tab" data-f="active" aria-selected="false">Active</button>
    <button class="tab" role="tab" data-f="done" aria-selected="false">Completed</button>
  </div>

  <ul id="list" aria-live="polite"></ul>

  <footer>
    <span id="count"></span>
    <button class="clear" id="clear" type="button">Clear completed</button>
  </footer>
</main>

<script>
(function(){
  var KEY="tasks.v1", THEME="tasks.theme";
  var tasks=[], filter="all";
  var $=function(s){return document.querySelector(s)};
  var list=$("#list"), input=$("#input"), form=$("#form");

  function load(){ try{ tasks=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ tasks=[]; } }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  function render(){
    var shown=tasks.filter(function(t){ return filter==="all"||(filter==="done"?t.done:!t.done); });
    list.innerHTML="";
    if(!shown.length){
      var e=document.createElement("li"); e.className="empty"; e.style.display="block"; e.style.animation="none";
      var msg={all:["No tasks yet","Type above and press Enter to add your first task."],
               active:["Nothing left to do","All tasks are completed."],
               done:["No completed tasks","Completed tasks will appear here."]}[filter];
      e.innerHTML="<strong>"+msg[0]+"</strong>"+msg[1];
      list.appendChild(e);
    }
    shown.forEach(function(t){
      var li=document.createElement("li"); if(t.done) li.className="done"; li.dataset.id=t.id;
      var cb=document.createElement("input"); cb.type="checkbox"; cb.className="check"; cb.checked=t.done;
      cb.setAttribute("aria-label","Mark \""+t.text+"\" as "+(t.done?"not done":"done"));
      var tx=document.createElement("span"); tx.className="text"; tx.textContent=t.text; tx.title="Double-click to edit";
      var d=document.createElement("button"); d.className="del"; d.type="button"; d.setAttribute("aria-label","Delete task");
      d.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';
      li.append(cb,tx,d); list.appendChild(li);
    });
    var done=tasks.filter(function(t){return t.done}).length, total=tasks.length, left=total-done;
    var pct=total?Math.round(done/total*100):0;
    $("#pct").textContent=pct+"%";
    $("#bar").style.strokeDashoffset=169.6*(1-pct/100);
    $("#count").textContent=total?(left+(left===1?" task":" tasks")+" left"):"Nothing planned";
    $("#clear").disabled=!done;
    document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-selected",b.dataset.f===filter); });
  }

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var v=input.value.trim(); if(!v) return;
    tasks.unshift({id:uid(),text:v,done:false});
    input.value=""; save(); render();
  });

  list.addEventListener("click",function(e){
    var li=e.target.closest("li[data-id]"); if(!li) return;
    var t=tasks.find(function(x){return x.id===li.dataset.id});
    if(e.target.closest(".del")){ tasks=tasks.filter(function(x){return x!==t}); }
    else if(e.target.classList.contains("check")){ t.done=e.target.checked; }
    else return;
    save(); render();
  });

  list.addEventListener("dblclick",function(e){
    var tx=e.target.closest(".text"); if(!tx) return;
    var li=tx.closest("li"), t=tasks.find(function(x){return x.id===li.dataset.id});
    var ed=document.createElement("input"); ed.type="text"; ed.className="edit"; ed.value=t.text; ed.maxLength=200;
    ed.setAttribute("aria-label","Edit task");
    tx.replaceWith(ed); ed.focus(); ed.select();
    var finished=false;
    function commit(ok){
      if(finished) return; finished=true;
      var v=ed.value.trim();
      if(ok&&v) t.text=v;
      save(); render();
    }
    ed.addEventListener("keydown",function(k){ if(k.key==="Enter") commit(true); if(k.key==="Escape") commit(false); });
    ed.addEventListener("blur",function(){ commit(true); });
  });

  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click",function(){ filter=b.dataset.f; render(); });
  });

  $("#clear").addEventListener("click",function(){
    tasks=tasks.filter(function(t){return !t.done}); save(); render();
  });

  $("#theme").addEventListener("click",function(){
    var root=document.documentElement;
    var dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    root.dataset.theme=dark?"light":"dark";
    try{ localStorage.setItem(THEME,root.dataset.theme); }catch(e){}
  });
  try{ var th=localStorage.getItem(THEME); if(th) document.documentElement.dataset.theme=th; }catch(e){}

  $("#date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  load(); render();
})();
</script>
</body>
</html>
